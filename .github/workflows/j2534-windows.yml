name: Offline Windows J2534 regression

on:
  push:
    branches: [fix/j2534-initialization-reliability, fix/j2534-transport-reliability, fix/subaru-sh7058-critical-safety, fix/subaru-sh7058-communication-reliability]
    paths:
      - '.github/workflows/j2534-windows.yml'
      - 'tests/j2534/**'
      - 'tests/subaru/**'
      - 'modules/ecu/flash_ecu_subaru_denso_sh7058_can.*'
      - 'modules/ecu/subaru_sh7058_safety.h'
      - 'modules/ecu/subaru_sh7058_kernel_layout.h'
      - 'modules/ecu/subaru_sh7058_upload_candidate.*'
      - 'modules/ecu/subaru_sh7058_preflight.*'
      - 'modules/checksum/checksum_ecu_subaru_denso_sh7xxx.*'
      - 'file_actions.*'
      - 'mainwindow.cpp'
      - 'menu_actions.cpp'
      - 'ecu_operations.ui'
      - 'kernelmemorymodels.h'
      - 'kernelcomms.h'
      - 'serial_port/J2534*'
      - 'serial_port/serial_port_actions_direct.*'
      - 'serial_port/serial_port_actions.*'
      - 'serial_port/communication_result.h'
      - 'serial_port/sh7058_candidate_link.*'
      - 'serial_port/sh7058_identification_session.*'
      - 'serial_port/j2534_*.h'
      - 'serial_port/j2534_*.inc'
      - 'tools/j2534_diagnostics/**'
      - 'main.cpp'
      - 'FastECU.pro'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enable x64 MSVC 2022
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0 (peeled commit)
        with:
          arch: x64
          vsversion: '2022'
      - name: Select Python for the Qt installer
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # Use the pinned node action directly: the top-level composite delegates
      # to mutable action tags even when the top-level reference is pinned.
      - name: Install Qt 5.15.2 MSVC x64 test dependencies
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          cache: false
      - name: Build and run J2534, Subaru safety, and offline candidate tests
        shell: pwsh
        run: ./tests/j2534/run-windows.ps1
      - name: Report installer failures
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path aqtinstall.log) {
            $tail = (Get-Content aqtinstall.log | Select-String '(?i)error|exception|archives|modules|available' | Select-Object -Last 12) -join "`n"
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::notice title=Qt installer diagnostics::$tail"
          }
      - name: Retain toolchain, build, and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: j2534-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-j2534/logs/
            build-j2534/diagnostic-tool-package/
            aqtinstall.log
          if-no-files-found: warn
          retention-days: 14
