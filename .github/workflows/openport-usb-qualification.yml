name: Reviewed custom OpenPort USB-only qualification build
on:
  workflow_dispatch:
  push:
    branches: [fix/subaru-sh7058-communication-reliability]
    paths:
      - 'tools/openport_usb_driver/**'
      - 'tools/romraider_logging_patch/**'
      - 'tools/j2534_diagnostics/**'
      - 'tools/windows/diagnostics-toolkit.ps1'
      - 'tools/windows/build-openport-usb.ps1'
      - 'gui/j2534_adapter_manager.*'
      - 'serial_port/j2534_adapter_selection.h'
      - 'serial_port/j2534_diagnostics.h'
      - 'tests/j2534/**'
      - '.github/workflows/openport-usb-qualification.yml'
permissions:
  contents: read
jobs:
  native-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Qt Core SDK and matching native x64 MinGW
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          archives: qtbase qttools
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'
          cache: false
      - name: Build reviewed driver and execute fake-USB tests only
        shell: pwsh
        run: |
          ./tools/windows/build-openport-usb.ps1 -BuildDirectory build-usb-qualification
      - name: Run native diagnostic regression suites and package separate artifacts
        shell: pwsh
        run: |
          $manifest=Get-Content build-usb-qualification/driver-build/build-manifest.json -Raw | ConvertFrom-Json
          ./tools/windows/diagnostics-toolkit.ps1 -Architecture x64 -BuildDirectory build-usb-qualification/diagnostics -ReviewedOpenPortSHA256 $manifest.j2534_dll_sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openport-usb-native-evidence-${{ github.sha }}
          path: |
            build-usb-qualification/driver-build/build-manifest.json
            build-usb-qualification/driver-build/fake-usb-results.json
            build-usb-qualification/driver-build/fake-logging-results.json
            build-usb-qualification/diagnostics/logs/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reviewed-openport-usb-driver-x64-${{ github.sha }}
          path: build-usb-qualification/driver-package/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: reviewed-openport-usb-diagnostics-x64-${{ github.sha }}
          path: build-usb-qualification/diagnostics/package/
          retention-days: 14

  offline-logging-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and sanitize actual driver with fake USB only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libusb-1.0-0-dev
          mkdir -p build-logging-evidence
          gcc -std=gnu11 -O1 -g -pthread -ffunction-sections -fdata-sections -Wno-pointer-sign -fno-pie -no-pie -fsanitize=address,undefined -fno-omit-frame-pointer -I/usr/include/libusb-1.0 tools/openport_usb_driver/tests/mock_logging.c -Wl,--gc-sections -o build-logging-evidence/fake-logging
          python3 - <<'PYTEST'
          import subprocess,json,os
          from pathlib import Path
          cases=['split','coalesced','partial-timeout','poll-carry','timeout-bytes','malformed','capacity','queue-limit','write-counts','write-capacity','filter-bounds','control-routing','clear','ownership','threads','repeated','fuzz','parameters']
          results=[]
          for case in cases:
              r=subprocess.run(['build-logging-evidence/fake-logging',case],capture_output=True,text=True,timeout=15,env=dict(os.environ,ASAN_OPTIONS='detect_leaks=1'))
              results.append({'case':case,'exit':r.returncode,'stdout':r.stdout,'stderr':r.stderr})
          Path('build-logging-evidence/sanitizer-results.json').write_text(json.dumps(results,indent=2))
          assert all(x['exit']==0 for x in results),results
          PYTEST
      - name: Build and offline-test separate RomRaider repair candidate
        run: |
          curl --fail -L 'https://github.com/RomRaider/RomRaider/releases/download/1.1.0-NOV26-2025/RomRaider1.1.0-experimental-amd64-windows.zip' -o build-logging-evidence/romraider-release.zip
          python3 - <<'PYEXTRACT'
          import zipfile
          with zipfile.ZipFile('build-logging-evidence/romraider-release.zip') as z:z.extractall('build-logging-evidence/original')
          PYEXTRACT
          python3 tools/romraider_logging_patch/build.py --romraider build-logging-evidence/original/RomRaider --output build-logging-evidence/romraider-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: logging-integrity-offline-evidence-${{ github.sha }}
          path: |
            build-logging-evidence/sanitizer-results.json
            build-logging-evidence/romraider-candidate/
          retention-days: 14
